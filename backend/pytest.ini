[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# The integration tests share one asyncpg pool, and pool connections are bound to
# the loop that created them - so fixtures and tests must share a single loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
